name: Sync Hugging Face portfolio

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: write

concurrency:
  group: huggingface-portfolio-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Synchronize public artifacts
        run: python scripts/sync_huggingface.py
      - name: Commit catalog changes
        run: |
          if git diff --quiet; then
            echo "Portfolio is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/portfolio.json docs/portfolio.json
          git commit -m "chore: sync Hugging Face portfolio [skip ci]"
          git push
